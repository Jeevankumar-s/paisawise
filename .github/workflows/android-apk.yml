name: Native Android standalone release APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          path: source
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Generate bare React Native CLI project
        run: npx --yes @react-native-community/cli@20.0.0 init PaisaWise --version 0.81.4 --skip-install
      - name: Copy source
        run: |
          cp source/App.tsx source/index.js source/app.json source/package.json source/babel.config.js source/metro.config.js source/tsconfig.json PaisaWise/
          cp -R source/src source/tests PaisaWise/
          cp source/native/*.kt PaisaWise/android/app/src/main/java/com/paisawise/
          python3 source/native/patch_android.py PaisaWise/android/app/src/main
      - name: Install dependencies
        working-directory: PaisaWise
        run: npm install --no-audit --no-fund
      - name: Run unit tests
        working-directory: PaisaWise
        run: npm test
      - name: Assemble standalone release APK
        working-directory: PaisaWise/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
      - name: Verify standalone APK contents
        working-directory: PaisaWise
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          unzip -t "$APK" | tail -n 2
          unzip -Z1 "$APK" | grep -Fx 'assets/index.android.bundle'
          echo "Verified: standalone JS bundle is packaged in release APK"
      - uses: actions/upload-artifact@v4
        with:
          name: PaisaWise-standalone-release-apk
          path: PaisaWise/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
